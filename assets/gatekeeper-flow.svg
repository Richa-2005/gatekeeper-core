<svg width="920" height="360" viewBox="0 0 920 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GateKeeper-Core request flow</title>
  <desc id="desc">Client requests pass through rate limiting and consistent hash routing before being assigned to backend servers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <rect x="24" y="24" width="872" height="312" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="460" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Gateway Traffic Control</text>
    <text x="460" y="84" text-anchor="middle" font-size="14" fill="#64748b">Rate limit first, then route each client to a stable backend node</text>

    <g filter="url(#shadow)">
      <rect x="58" y="130" width="150" height="72" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="133" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Clients</text>
      <text x="133" y="181" text-anchor="middle" font-size="13" fill="#4338ca">HTTP requests</text>
    </g>

    <g stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 208 166 C 246 166, 260 166, 296 166"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="296" y="116" width="170" height="100" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="381" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#164e63">GateKeeper</text>
      <rect x="322" y="162" width="118" height="30" rx="15" fill="#ffffff" stroke="#67e8f9"/>
      <text x="381" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#155e75">Rate Limit</text>
    </g>

    <g stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 466 166 C 500 166, 516 166, 548 166"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="548" y="116" width="170" height="100" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="633" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Hash Ring</text>
      <circle cx="603" cy="177" r="17" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
      <circle cx="633" cy="177" r="17" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
      <circle cx="663" cy="177" r="17" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
      <text x="633" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">route</text>
    </g>

    <g stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 718 148 C 748 126, 766 114, 795 104"/>
      <path d="M 718 166 C 750 166, 765 166, 795 166"/>
      <path d="M 718 184 C 748 206, 766 218, 795 228"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="795" y="74" width="78" height="54" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="834" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Server 1</text>
      <text x="834" y="114" text-anchor="middle" font-size="11" fill="#9a3412">:8001</text>

      <rect x="795" y="142" width="78" height="54" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="834" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Server 2</text>
      <text x="834" y="182" text-anchor="middle" font-size="11" fill="#9a3412">:8002</text>

      <rect x="795" y="210" width="78" height="54" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="834" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Server 3</text>
      <text x="834" y="250" text-anchor="middle" font-size="11" fill="#9a3412">:8003</text>
    </g>

    <g>
      <path d="M 381 192 L 381 247" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
      <rect x="226" y="266" width="310" height="34" rx="17" fill="#fef2f2" stroke="#fecaca"/>
      <text x="381" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Over-limit requests stop here with 429</text>
    </g>
  </g>
</svg>
